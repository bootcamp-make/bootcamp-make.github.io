<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카페 매출 계산기</title>
<style>
  :root{ --bg:#f4f5f7; --card:#ffffff; --ink:#1b1b1f; --muted:#6b6f76;
         --line:#e3e5e9; --accent:#1f6feb; --hi:#eef3fb; --field:#fafbfc; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
       line-height:1.5;padding:24px 16px 48px}
  .wrap{max-width:860px;margin:0 auto}
  .crumb{font-size:14px;color:var(--muted);margin-bottom:14px}
  .crumb a{color:var(--accent);text-decoration:none}
  h1{font-size:28px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:15px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:26px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  @media(max-width:640px){.grid{grid-template-columns:1fr;gap:22px}}
  h2{font-size:15px;color:var(--muted);font-weight:700;margin:0 0 14px;
     letter-spacing:.02em}
  label{display:block;font-size:15px;font-weight:700;margin:16px 0 6px}
  .field{display:flex;align-items:center;gap:8px}
  input{width:100%;padding:12px 14px;font-size:17px;border:1px solid var(--line);
        border-radius:10px;background:var(--field);color:var(--ink);text-align:right}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .unit{color:var(--muted);font-size:15px;white-space:nowrap}
  button{margin-top:22px;width:100%;padding:14px;font-size:17px;font-weight:700;
         color:#fff;background:#252528;border:none;border-radius:10px;cursor:pointer}
  button:hover{background:#000}
  .row{display:flex;justify-content:space-between;align-items:center;
       background:var(--hi);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  .row.main{background:#e7f0ff;outline:1px solid #cfe0ff}
  .row .k{font-size:15px;font-weight:700}
  .row .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .foot{color:var(--muted);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="../">← 나의 AI 포트폴리오</a></div>
  <h1>카페 매출 계산기</h1>
  <p class="sub">판매가격·예상 판매량·한 잔당 원가를 입력해 예상 매출과 매출총이익을 확인합니다.</p>

  <div class="card">
    <div class="grid">
      <div>
        <h2>입력</h2>
        <label for="price">판매가격</label>
        <div class="field"><input id="price" type="number" inputmode="numeric" value="4000" min="0"><span class="unit">원</span></div>
        <label for="qty">예상 판매량</label>
        <div class="field"><input id="qty" type="number" inputmode="numeric" value="50" min="0"><span class="unit">잔</span></div>
        <label for="cost">한 잔당 원가</label>
        <div class="field"><input id="cost" type="number" inputmode="numeric" value="1200" min="0"><span class="unit">원</span></div>
        <button id="calc">계산하기</button>
      </div>
      <div>
        <h2>계산 결과</h2>
        <div class="row"><span class="k">예상 매출</span><span class="v" id="sales">0원</span></div>
        <div class="row"><span class="k">총원가</span><span class="v" id="totalcost">0원</span></div>
        <div class="row main"><span class="k">매출총이익</span><span class="v" id="profit">0원</span></div>
        <div class="row"><span class="k">매출총이익률</span><span class="v" id="margin">0%</span></div>
      </div>
    </div>
    <p class="foot">학습용 계산 · 임대료·인건비 등을 포함한 최종 순이익이 아닙니다.</p>
  </div>
</div>

<script>
  var won = function(n){ return Math.round(n).toLocaleString('ko-KR') + '원'; };
  function calc(){
    var p = Number(document.getElementById('price').value) || 0;
    var q = Number(document.getElementById('qty').value) || 0;
    var c = Number(document.getElementById('cost').value) || 0;
    var sales = p * q;
    var totalCost = c * q;
    var profit = sales - totalCost;
    var margin = sales > 0 ? (profit / sales) * 100 : 0;
    document.getElementById('sales').textContent = won(sales);
    document.getElementById('totalcost').textContent = won(totalCost);
    document.getElementById('profit').textContent = won(profit);
    document.getElementById('margin').textContent =
      (Math.round(margin * 10) / 10).toString().replace(/\.0$/, '') + '%';
  }
  document.getElementById('calc').addEventListener('click', calc);
  ['price','qty','cost'].forEach(function(id){
    document.getElementById(id).addEventListener('input', calc);
  });
  calc();
</script>
</body>
</html>
